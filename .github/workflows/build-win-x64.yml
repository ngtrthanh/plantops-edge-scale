name: Build native Windows Edge

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.302"

      - name: Show SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish self-contained win-x64
        run: dotnet publish -c Release -r win-x64 --self-contained true -o out/publish

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path .\out\publish\PlantOps.Edge.Scale.exe)) {
            throw "PlantOps.Edge.Scale.exe not found"
          }

      - name: Smoke test Kestrel + demo cycle
        shell: pwsh
        run: |
          $proc = Start-Process ".\out\publish\PlantOps.Edge.Scale.exe" -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:8080/healthz" -TimeoutSec 2
                if ($health.status -eq "ok") {
                  $healthy = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $healthy) { throw "Kestrel /healthz did not become healthy" }

            $state = Invoke-RestMethod "http://127.0.0.1:8080/api/state"
            if (-not $state.phase) { throw "State API failed" }

            Invoke-RestMethod "http://127.0.0.1:8080/api/demo/run" -Method Post | Out-Null
            Start-Sleep -Seconds 8

            $tickets = @(Invoke-RestMethod "http://127.0.0.1:8080/api/tickets")
            if ($tickets.Count -lt 1) { throw "Demo cycle did not write a ticket" }
          }
          finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
          }

      - name: Package immutable artifact
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}"
          $zip = ".\out\plantops-edge-scale-win-x64-sha-$sha.zip"
          Compress-Archive -Path .\out\publish\* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  plantops-edge-scale-win-x64-sha-$sha.zip" | Set-Content ".\out\plantops-edge-scale-win-x64-sha-$sha.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: plantops-edge-scale-${{ github.sha }}
          path: |
            out/plantops-edge-scale-win-x64-sha-${{ github.sha }}.zip
            out/plantops-edge-scale-win-x64-sha-${{ github.sha }}.zip.sha256
          if-no-files-found: error
