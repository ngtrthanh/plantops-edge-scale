name: Build native Windows Edge

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.302"

      - name: Show SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish self-contained win-x64
        run: dotnet publish -c Release -r win-x64 --self-contained true -o out/publish

      - name: Verify executable and animated UI files
        shell: pwsh
        run: |
          if (-not (Test-Path .\out\publish\PlantOps.Edge.Scale.exe)) {
            throw "PlantOps.Edge.Scale.exe not found"
          }

          $index = ".\out\publish\wwwroot\index.html"
          if (-not (Test-Path $index)) {
            throw "wwwroot/index.html not found"
          }

          $html = Get-Content $index -Raw
          if ($html -notmatch "Hardware Workflow Demo") {
            throw "Animated hardware UI marker not found"
          }
          if ($html -notmatch "/api/events") {
            throw "Animated UI does not call /api/events"
          }
          if ($html -notmatch "/api/reset") {
            throw "Animated UI does not call /api/reset"
          }

      - name: Smoke test Kestrel + animated hardware API flow
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "http://127.0.0.1:8080"
          $proc = Start-Process ".\out\publish\PlantOps.Edge.Scale.exe" -PassThru

          try {
            $healthy = $false
            for ($i = 0; $i -lt 40; $i++) {
              try {
                $health = Invoke-RestMethod "$base/healthz" -TimeoutSec 2
                if ($health.status -eq "ok") {
                  $healthy = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $healthy) { throw "Kestrel /healthz did not become healthy" }

            # Verify the animated web UI is actually being served by this executable.
            $page = Invoke-WebRequest "$base/" -UseBasicParsing
            if ($page.StatusCode -ne 200) { throw "GET / failed" }
            if ($page.Content -notmatch "Hardware Workflow Demo") {
              throw "Running executable is not serving the animated hardware UI"
            }

            # Verify APIs required by the animated page exist and return JSON.
            $state = Invoke-RestMethod "$base/api/state"
            if (-not $state.phase) { throw "State API failed" }

            $eventsBefore = @(Invoke-RestMethod "$base/api/events")
            $ticketsBefore = @(Invoke-RestMethod "$base/api/tickets")

            # Reset must be a real endpoint, not SPA fallback HTML.
            $reset = Invoke-RestMethod "$base/api/reset" -Method Post
            if ($reset.status -ne "reset") { throw "Reset API failed" }

            # Start a full simulated truck cycle.
            $run = Invoke-RestMethod "$base/api/demo/run" -Method Post
            if ($run.status -ne "started") { throw "Demo run API failed" }

            # Observe live intermediate state so we know the cycle actually moves.
            Start-Sleep -Seconds 2
            $mid = Invoke-RestMethod "$base/api/state"
            if (-not $mid.running) { throw "Demo cycle is not running after start" }
            if (-not $mid.rfid) { throw "RFID stage did not occur" }

            # Wait for completion with a bounded timeout.
            $completed = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              $state = Invoke-RestMethod "$base/api/state"
              if (-not $state.running -and $state.phase -eq "COMPLETE") {
                $completed = $true
                break
              }
            }
            if (-not $completed) { throw "Demo truck cycle did not complete" }

            $eventsAfter = @(Invoke-RestMethod "$base/api/events")
            $ticketsAfter = @(Invoke-RestMethod "$base/api/tickets")

            if ($eventsAfter.Count -le $eventsBefore.Count) {
              throw "Event stream did not grow during demo cycle"
            }
            if ($ticketsAfter.Count -le $ticketsBefore.Count) {
              throw "Demo cycle did not write a new ticket"
            }

            $latest = $ticketsAfter | Select-Object -First 1
            if ($latest.plate -ne "15C-123.45") { throw "Plate capture/OCR result missing from ticket" }
            if ($latest.rfid -ne "RFID-DEMO-001") { throw "RFID result missing from ticket" }
            if ([int]$latest.weightKg -ne 28460) { throw "Stable weight missing from ticket" }

            Write-Host "Animated hardware runtime smoke test PASS"
            Write-Host "Phase: $($state.phase)"
            Write-Host "Ticket: $($latest.ticketId)"
            Write-Host "Plate: $($latest.plate)"
            Write-Host "RFID: $($latest.rfid)"
            Write-Host "Weight: $($latest.weightKg) kg"
            Write-Host "Events: $($eventsAfter.Count)"
          }
          finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
          }

      - name: Add local demo launchers
        shell: pwsh
        run: |
          Copy-Item .\pack\RUN-DEMO.cmd .\out\publish\RUN-DEMO.cmd
          Copy-Item .\pack\STOP-DEMO.cmd .\out\publish\STOP-DEMO.cmd
          Copy-Item .\pack\README-LOCAL-DEMO.txt .\out\publish\README-LOCAL-DEMO.txt

      - name: Package immutable local demo artifact
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}"
          $zip = ".\out\plantops-edge-scale-local-demo-win-x64-sha-$sha.zip"
          Compress-Archive -Path .\out\publish\* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  plantops-edge-scale-local-demo-win-x64-sha-$sha.zip" | Set-Content ".\out\plantops-edge-scale-local-demo-win-x64-sha-$sha.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: plantops-edge-scale-local-demo-${{ github.sha }}
          path: |
            out/plantops-edge-scale-local-demo-win-x64-sha-${{ github.sha }}.zip
            out/plantops-edge-scale-local-demo-win-x64-sha-${{ github.sha }}.zip.sha256
          if-no-files-found: error
